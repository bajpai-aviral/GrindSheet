<div class="auth-container">

  <div class="auth-box">

    <!-- Logo -->
    <div class="logo-section">
      <h1 class="logo">🔥 GrindSheet</h1>
      <p class="tagline">Your personal fitness tracker</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="tab" routerLink="/login">Log in</button>
      <button class="tab active">Sign up</button>
    </div>

    <!-- Form -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <div class="field-group">
        <label>FULL NAME</label>
        <div class="input-wrapper">
          <input
            type="text"
            formControlName="name"
            placeholder="e.g. First Last"
            class="input-field">
        </div>
        <span class="field-error" *ngIf="name?.touched && name?.hasError('required')">
          Name is required
        </span>
      </div>

      <div class="field-group">
        <label>EMAIL</label>
        <div class="input-wrapper">
          <input
            type="email"
            formControlName="email"
            placeholder="e.g. name@gmail.com"
            class="input-field">
        </div>
        <span class="field-error" *ngIf="email?.touched && email?.hasError('required')">
          Email is required
        </span>
        <span class="field-error" *ngIf="email?.touched && email?.hasError('email')">
          Please enter a valid email
        </span>
      </div>

      <div class="field-group">
        <label>PASSWORD</label>
        <div class="input-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            class="input-field">
          <button type="button" class="eye-btn" (click)="hidePassword = !hidePassword">
            <span>{{ hidePassword ? '👁' : '👁‍🗨' }}</span>
          </button>
        </div>
        <span class="field-error" *ngIf="password?.touched && password?.hasError('required')">
          Password is required
        </span>
        <span class="field-error" *ngIf="password?.touched && password?.hasError('pattern')">
          Must contain uppercase, lowercase, number and special character
        </span>
      </div>

      <div class="password-hint">
        Min 8 chars — uppercase, lowercase, number, special character (@#$!...)
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="registerForm.invalid || isLoading">
        <span *ngIf="!isLoading">Create Account</span>
        <span *ngIf="isLoading">Creating account...</span>
      </button>

    </form>

  </div>

</div>
