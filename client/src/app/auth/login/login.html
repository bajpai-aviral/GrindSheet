<div class="auth-container">

  <div class="auth-box">

    <!-- Logo -->
    <div class="logo-section">
      <h1 class="logo">🔥 GrindSheet</h1>
      <p class="tagline">Your personal fitness tracker</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="tab active">Log in</button>
      <button class="tab" routerLink="/register">Sign up</button>
    </div>

    <!-- Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <div class="field-group">
        <label>EMAIL</label>
        <div class="input-wrapper">
          <input
            type="email"
            formControlName="email"
            placeholder="e.g. name@gmail.com"
            class="input-field">
        </div>
        <span class="field-error" *ngIf="email?.touched && email?.hasError('required')">
          Email is required
        </span>
        <span class="field-error" *ngIf="email?.touched && email?.hasError('email')">
          Please enter a valid email
        </span>
      </div>

      <div class="field-group">
        <label>PASSWORD</label>
        <div class="input-wrapper">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            formControlName="password"
            placeholder="••••••••"
            class="input-field">
          <button type="button" class="eye-btn" (click)="hidePassword = !hidePassword">
            <span>{{ hidePassword ? '👁' : '👁‍🗨' }}</span>
          </button>
        </div>
        <span class="field-error" *ngIf="password?.touched && password?.hasError('required')">
          Password is required
        </span>
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <button
        type="submit"
        class="submit-btn"
        [disabled]="loginForm.invalid || isLoading">
        <span *ngIf="!isLoading">Log in</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>

    </form>

  </div>

</div>
